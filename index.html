<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Elecciones Comité de Convivencia Laboral · Hacienda La Gloria</title>
<meta name="description" content="Resultados oficiales de la elección del Comité de Convivencia Laboral - Grupo Agroindustrial Hacienda La Gloria" />
<style>
  :root{
    --verde-1:#0f3d24;
    --verde-2:#155c34;
    --verde-3:#1f7a43;
    --dorado:#e8a838;
    --rojo:#c0392b;
    --texto:#f5f1e6;
    --texto-muted:#c9d6c9;
    --card-bg:rgba(255,255,255,0.06);
    --card-border:rgba(255,255,255,0.14);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    height:100%;
    overflow:hidden;
  }

  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 20% -10%, rgba(232,168,56,0.18), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(31,122,67,0.35), transparent 40%),
      linear-gradient(160deg, var(--verde-1) 0%, #0a2c19 55%, #081f12 100%);
    color:var(--texto);
    height:100dvh;
    width:100vw;
  }

  .bg-fields{
    position:fixed;
    inset:0;
    z-index:-2;
    opacity:0.3;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 40px);
    pointer-events:none;
  }

  .floating-leaf{
    position:fixed;
    top:-40px;
    font-size:16px;
    opacity:0.4;
    animation:fall linear infinite;
    z-index:-1;
    pointer-events:none;
  }

  @keyframes fall{
    0%{transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:0.5;}
    90%{opacity:0.4;}
    100%{transform:translateY(110vh) translateX(40px) rotate(360deg); opacity:0;}
  }

  .app{
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
    padding:clamp(8px,1.6vh,20px) clamp(12px,2.4vw,36px);
    gap:clamp(6px,1.2vh,14px);
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 16px;
    animation:fadeDown 0.7s ease both;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .logo-x{
    font-weight:900;
    font-size:clamp(18px,2.4vh,26px);
    background:linear-gradient(120deg, var(--rojo), var(--dorado), var(--verde-3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1;
  }

  .brand-text{
    line-height:1.15;
  }

  .brand-text .co{
    font-size:clamp(10px,1.3vh,13px);
    color:var(--texto-muted);
    letter-spacing:0.5px;
    font-weight:600;
  }

  h1{
    font-size:clamp(15px,2.3vh,24px);
    font-weight:800;
  }

  h1 .accent{
    background:linear-gradient(120deg, var(--dorado), #ffd873);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:clamp(11px,1.3vh,13px);
    letter-spacing:0.3px;
    white-space:nowrap;
  }

  .status-pill.final{
    background:rgba(31,122,67,0.22);
    border:1px solid rgba(31,122,67,0.6);
    color:#7de3a6;
  }

  .status-pill.pending{
    background:rgba(232,168,56,0.14);
    border:1px solid rgba(232,168,56,0.5);
    color:#ffd873;
  }

  .pulse-dot{
    width:8px;height:8px;border-radius:50%;
    background:#7de3a6;
    animation:pulse 1.6s infinite;
  }

  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(125,227,166,0.55);}
    70%{box-shadow:0 0 0 10px rgba(125,227,166,0);}
    100%{box-shadow:0 0 0 0 rgba(125,227,166,0);}
  }

  @keyframes fadeDown{from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  @keyframes popIn{from{opacity:0; transform:scale(0.85);} to{opacity:1; transform:scale(1);}}

  /* ---------- stats row ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:clamp(6px,1vw,14px);
    animation:fadeUp 0.7s ease both;
    animation-delay:0.1s;
  }

  .stat-card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:clamp(6px,1.1vh,14px) 10px;
    text-align:center;
  }

  .stat-value{
    font-size:clamp(16px,2.6vh,28px);
    font-weight:800;
    color:var(--dorado);
    font-variant-numeric:tabular-nums;
    line-height:1.1;
  }

  .stat-label{
    font-size:clamp(9px,1.1vh,12px);
    color:var(--texto-muted);
    letter-spacing:0.3px;
  }

  /* ---------- candidates grid ---------- */
  .candidates{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:clamp(6px,1vw,12px);
    min-height:0;
  }

  .card{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:clamp(6px,1.4vh,14px) clamp(6px,0.8vw,10px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    min-height:0;
    animation:popIn 0.6s cubic-bezier(.2,.8,.3,1.3) both;
  }

  .card.winner{
    border-color:var(--dorado);
    box-shadow:0 0 0 1px rgba(232,168,56,0.45), 0 14px 30px rgba(232,168,56,0.18);
    background:rgba(232,168,56,0.08);
  }

  .winner-badge{
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(120deg, var(--dorado), #ffdb85);
    color:#3a2a05;
    font-size:clamp(8px,0.95vh,10.5px);
    font-weight:800;
    padding:2px 9px;
    border-radius:999px;
    letter-spacing:0.3px;
    white-space:nowrap;
    box-shadow:0 3px 10px rgba(232,168,56,0.4);
  }

  .photo-wrap{
    width:clamp(46px,9vh,92px);
    height:clamp(46px,9vh,92px);
    border-radius:50%;
    overflow:hidden;
    margin-bottom:clamp(4px,0.9vh,10px);
    flex-shrink:0;
    box-shadow:0 6px 16px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(255,255,255,0.2);
    background:linear-gradient(135deg,#33413a,#1c2a22);
  }

  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .photo-wrap.special{
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:clamp(16px,2.6vh,28px);
  }

  .photo-wrap.blanco{ background:linear-gradient(135deg,#95a5a6,#dfe6e9); color:#3a4245; }
  .photo-wrap.nulo{ background:linear-gradient(135deg,#8d5524,#c0392b); color:#fff; }

  .name{
    font-weight:700;
    font-size:clamp(10.5px,1.35vh,14px);
    line-height:1.2;
    margin-bottom:2px;
  }

  .role{
    font-size:clamp(8.5px,1vh,11px);
    color:var(--texto-muted);
    margin-bottom:clamp(4px,1vh,10px);
    line-height:1.15;
  }

  .card-bottom{
    margin-top:auto;
    width:100%;
  }

  .bar-track{
    height:clamp(5px,0.9vh,8px);
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    margin-bottom:clamp(3px,0.7vh,7px);
  }

  .bar-fill{
    height:100%;
    border-radius:999px;
    width:0%;
    background:linear-gradient(90deg, var(--verde-3), var(--dorado));
    transition:width 1.5s cubic-bezier(.16,.84,.44,1);
  }

  .bar-fill.blank{ background:linear-gradient(90deg, #7d8a86, #b7c2be); }
  .bar-fill.null{ background:linear-gradient(90deg, #8d5524, #c0392b); }

  .result-row{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:5px;
  }

  .result-row .votos{
    font-size:clamp(12px,1.7vh,17px);
    font-weight:800;
    color:var(--texto);
    font-variant-numeric:tabular-nums;
  }

  .result-row .pct{
    font-size:clamp(8.5px,1vh,11px);
    color:var(--texto-muted);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- footer ---------- */
  footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:4px 12px;
    color:var(--texto-muted);
    font-size:clamp(9px,1vh,11.5px);
    border-top:1px solid var(--card-border);
    padding-top:clamp(5px,0.9vh,10px);
    animation:fadeUp 0.7s ease both;
    animation-delay:0.2s;
  }

  footer .brand-name{
    font-weight:700;
    color:var(--texto);
  }

  @media (max-width:820px){
    .candidates{
      grid-template-columns:repeat(4, 1fr);
      grid-auto-rows:1fr;
    }
    .stats{grid-template-columns:repeat(2,1fr);}
  }

  @media (max-width:520px){
    .candidates{
      grid-template-columns:repeat(3, 1fr);
    }
    header h1{width:100%;}
  }
</style>
</head>
<body>

<div class="bg-fields"></div>
<div id="leaves"></div>

<div class="app">

  <header>
    <div class="brand">
      <span class="logo-x">✕</span>
      <div class="brand-text">
        <h1>Elecciones <span class="accent">Comité de Convivencia Laboral</span></h1>
        <div class="co">GRUPO AGROINDUSTRIAL HACIENDA LA GLORIA</div>
      </div>
    </div>
    <div class="status-pill final" id="status-pill">
      <span class="pulse-dot"></span>
      <span id="status-text">Resultados oficiales</span>
    </div>
  </header>

  <section class="stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">Votos totales</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-candidatos">5</div>
      <div class="stat-label">Candidatos</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-blancos">0</div>
      <div class="stat-label">Votos en blanco</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-nulos">0</div>
      <div class="stat-label">Votos nulos</div>
    </div>
  </section>

  <section class="candidates" id="candidates"></section>

  <footer>
    <div><span class="brand-name">Grupo Agroindustrial Hacienda La Gloria</span> · Comité de Convivencia Laboral</div>
    <div id="updated-at"></div>
  </footer>

</div>

<script>
/* =========================================================
   DATOS DE LA ELECCIÓN
   ========================================================= */
const RESULTADOS_DISPONIBLES = true;
const CUPOS_COMITE = 4; // número de personas que entran al comité (más votadas)

const candidatos = [
  { id:"hernan",     nombre: "Hernán José Trujillo Muñoz", cargo: "Operario de campo HLG",      votos: 105, foto: "img/hernan.jpg" },
  { id:"cesar",      nombre: "Cesar Caamaño Oliveros",     cargo: "Operario de campo HLG",      votos: 56,  foto: "img/cesar.jpg" },
  { id:"luis",       nombre: "Luis Tariffa Garcia",        cargo: "Operario de campo HLG",      votos: 49,  foto: "img/luis.jpg" },
  { id:"daniel",     nombre: "Daniel Chinchilla Sarabia",  cargo: "Controlador de Acceso HLG",  votos: 39,  foto: "img/daniel.jpg" },
  { id:"eustiquio",  nombre: "Eustiquio Rinaldy Perez",    cargo: "Operario de campo HLG",      votos: 30,  foto: "img/eustiquio.jpg" },
];
const votosBlanco = 37;
const votosNulo = 6;

/* ========================================================= */

function animateCount(el, to, duration=1300){
  const startTime = performance.now();
  function tick(now){
    const p = Math.min((now-startTime)/duration, 1);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(to*eased).toLocaleString('es-CO');
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function render(){
  const totalVotos = candidatos.reduce((s,c)=>s+c.votos,0) + votosBlanco + votosNulo;
  const ordenados = [...candidatos].sort((a,b)=>b.votos-a.votos);
  const electosIds = new Set(ordenados.slice(0, CUPOS_COMITE).map(c=>c.id));

  document.getElementById('stat-candidatos').textContent = candidatos.length;
  animateCount(document.getElementById('stat-total'), totalVotos);
  animateCount(document.getElementById('stat-blancos'), votosBlanco);
  animateCount(document.getElementById('stat-nulos'), votosNulo);

  const statusPill = document.getElementById('status-pill');
  const statusText = document.getElementById('status-text');
  if(!RESULTADOS_DISPONIBLES){
    statusPill.classList.remove('final');
    statusPill.classList.add('pending');
    statusText.textContent = "Conteo en curso · resultados próximamente";
  }

  const grid = document.getElementById('candidates');
  grid.innerHTML = '';

  candidatos.forEach((c, idx)=>{
    const pct = totalVotos>0 ? (c.votos/totalVotos*100) : 0;
    const isWinner = RESULTADOS_DISPONIBLES && electosIds.has(c.id);
    const card = document.createElement('div');
    card.className = 'card' + (isWinner ? ' winner' : '');
    card.style.animationDelay = (idx*0.07)+'s';
    card.innerHTML = `
      ${isWinner ? '<div class="winner-badge">ELECTO</div>' : ''}
      <div class="photo-wrap"><img src="${c.foto}" alt="${c.nombre}"></div>
      <div class="name">${c.nombre}</div>
      <div class="role">${c.cargo}</div>
      <div class="card-bottom">
        <div class="bar-track"><div class="bar-fill" data-pct="${pct}"></div></div>
        <div class="result-row">
          <span class="votos">${RESULTADOS_DISPONIBLES ? c.votos.toLocaleString('es-CO') : '—'}</span>
          <span class="pct">${RESULTADOS_DISPONIBLES ? pct.toFixed(1)+'%' : 'pendiente'}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // voto en blanco
  const pctBlanco = totalVotos>0 ? (votosBlanco/totalVotos*100) : 0;
  const blancoCard = document.createElement('div');
  blancoCard.className = 'card';
  blancoCard.style.animationDelay = (candidatos.length*0.07)+'s';
  blancoCard.innerHTML = `
    <div class="photo-wrap special blanco">✕</div>
    <div class="name">Voto en blanco</div>
    <div class="role">&nbsp;</div>
    <div class="card-bottom">
      <div class="bar-track"><div class="bar-fill blank" data-pct="${pctBlanco}"></div></div>
      <div class="result-row">
        <span class="votos">${RESULTADOS_DISPONIBLES ? votosBlanco.toLocaleString('es-CO') : '—'}</span>
        <span class="pct">${RESULTADOS_DISPONIBLES ? pctBlanco.toFixed(1)+'%' : 'pendiente'}</span>
      </div>
    </div>
  `;
  grid.appendChild(blancoCard);

  // voto nulo
  const pctNulo = totalVotos>0 ? (votosNulo/totalVotos*100) : 0;
  const nuloCard = document.createElement('div');
  nuloCard.className = 'card';
  nuloCard.style.animationDelay = ((candidatos.length+1)*0.07)+'s';
  nuloCard.innerHTML = `
    <div class="photo-wrap special nulo">⊘</div>
    <div class="name">Voto nulo</div>
    <div class="role">&nbsp;</div>
    <div class="card-bottom">
      <div class="bar-track"><div class="bar-fill null" data-pct="${pctNulo}"></div></div>
      <div class="result-row">
        <span class="votos">${RESULTADOS_DISPONIBLES ? votosNulo.toLocaleString('es-CO') : '—'}</span>
        <span class="pct">${RESULTADOS_DISPONIBLES ? pctNulo.toFixed(1)+'%' : 'pendiente'}</span>
      </div>
    </div>
  `;
  grid.appendChild(nuloCard);

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      document.querySelectorAll('.bar-fill').forEach(el=>{
        const pct = RESULTADOS_DISPONIBLES ? el.dataset.pct : 0;
        el.style.width = pct + '%';
      });
    }, 250);
  });

  document.getElementById('updated-at').textContent =
    "Actualizado: " + new Date().toLocaleDateString('es-CO', { day:'2-digit', month:'long', year:'numeric' });
}

render();

/* floating leaves decoration */
const leavesContainer = document.getElementById('leaves');
const leafEmojis = ['🌿','🍃'];
for(let i=0;i<8;i++){
  const leaf = document.createElement('span');
  leaf.className = 'floating-leaf';
  leaf.textContent = leafEmojis[i%leafEmojis.length];
  leaf.style.left = Math.random()*100 + 'vw';
  leaf.style.animationDuration = (16 + Math.random()*14) + 's';
  leaf.style.animationDelay = (Math.random()*14) + 's';
  leaf.style.fontSize = (12 + Math.random()*10) + 'px';
  leavesContainer.appendChild(leaf);
}
</script>

</body>
</html>
